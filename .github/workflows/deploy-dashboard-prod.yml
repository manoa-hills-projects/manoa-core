# Deploy Dashboard to Production
#
# Triggers on every push to `main` that touches the dashboard.
#
# Required GitHub repository secrets:
#   CF_API_TOKEN          - Cloudflare API token with Pages edit permissions.
#
# Required GitHub repository variables:
#   CF_ACCOUNT_ID         - Cloudflare account ID.

name: Deploy Dashboard - PROD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/dashboard/**'

env:
  ENVIRONMENT: prod

jobs:
  deploy-dashboard-prod:
    name: Deploy Dashboard (PROD)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://manoa-backoffice.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod
        working-directory: apps/dashboard

      - name: Deploy to Cloudflare Pages (PROD)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          projectName: manoa-backoffice
          directory: dist
          workingDirectory: apps/dashboard
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}