# Deploy API + AI Worker to Production
#
# Triggers on every push to `main` that touches the API.
# Terraform is NOT run here; it is only used locally/manualy in infrastructure/.
#
# Required GitHub repository secrets:
#   CF_API_TOKEN - Cloudflare API token with Workers edit permissions.
#
# Required GitHub repository variables:
#   CF_ACCOUNT_ID - Cloudflare account ID.

name: Deploy API - PROD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'

env:
  ENVIRONMENT: prod

jobs:
  deploy-api:
    name: Deploy API Worker (PROD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy API Worker
        run: npm run deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy-ai:
    name: Deploy AI Worker (PROD)
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy AI Worker
        run: npm run deploy:ai:prod
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
